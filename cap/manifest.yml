applications:
  - name: hydra-rerouting
    path: .
    memory: 256M
    disk_quota: 512M
    buildpacks: [nodejs_buildpack]
    command: npm start
    random-route: true
    health-check-type: http
    health-check-http-endpoint: /health
    env:
      # Origins allowed to call the API from another site (comma-separated, "*" for any).
      HYDRA_CORS_ORIGINS: https://tawheedali1407.github.io
